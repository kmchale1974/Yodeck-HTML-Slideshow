name: Build Admin images.json (Runtime Pi-safe)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "_Yodeck-HTML-Slideshow_Admin/images/**"
      - "_Yodeck-HTML-Slideshow_Runtime/images/.gitkeep"
      - "tools/gen_images_json.py"
      - "tools/build_runtime_media.sh"
      - ".github/workflows/build-admin-images-json.yml"

permissions:
  contents: write

jobs:
  build-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Needed to transcode videos into Pi-safe versions
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # STEP B output: rebuild _Yodeck-HTML-Slideshow_Runtime/images every run
      - name: Build Runtime media (copy images + transcode video)
        run: |
          bash tools/build_runtime_media.sh

      # ✅ STEP C: generate images.json from the Runtime folder (NOT Admin)
      - name: Generate images.json from Runtime images
        run: |
          python - <<'PY'
          from tools.gen_images_json import build_manifest
          build_manifest("_Yodeck-HTML-Slideshow_Runtime/images", "images.json")
          PY

      # (Step D lives here, but leaving it included so Step C actually persists)
      - name: Commit changes if any
        run: |
          git config user.name "gh-actions"
          git config user.email "actions@users.noreply.github.com"

          git add images.json _Yodeck-HTML-Slideshow_Runtime/images

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(runtime): rebuild Pi-safe media + images.json [skip ci]"
          git push
