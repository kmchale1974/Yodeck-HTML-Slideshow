name: Build PolicePublic images.json (Runtime Pi-safe)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "_Yodeck-HTML-Slideshow_PoliceEmployee/images/**"
      - "tools/build_runtime_media_policeemployee.sh"
      - "tools/gen_images_json.py"
      - ".github/workflows/build-policeemployee-images-json.yml"

permissions:
  contents: write

jobs:
  build-policepublic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Debug PoliceEmployee runtime path
        run: |
          set -x
          ls -lah _Yodeck-HTML-Slideshow_PoliceEmployee_Runtime || true
          ls -lah _Yodeck-HTML-Slideshow_PoliceEmployee_Runtime/images || true
          file _Yodeck-HTML-Slideshow_PoliceEmployee_Runtime/images || true
          find _Yodeck-HTML-Slideshow_PoliceEmployee_Runtime -maxdepth 2 -print || true

      - name: Build Runtime media (PoliceEmployee)
        run: |
          chmod +x tools/build_runtime_media_policeemployee.sh
          bash tools/build_runtime_media_policeemployee.sh

      - name: Generate images-policeemployee.json from Runtime images
        run: |
          python - <<'PY'
          from tools.gen_images_json import build_manifest
          build_manifest("_Yodeck-HTML-Slideshow_PoliceEmployee_Runtime/images", "images-policeemployee.json")
          PY

      - name: Commit changes if any
        run: |
          git config user.name "gh-actions"
          git config user.email "actions@users.noreply.github.com"

          git add images-policepublic.json _Yodeck-HTML-Slideshow_PoliceEmployee_Runtime/images

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(policepublic): rebuild Pi-safe media + manifest [skip ci]"
          git push
