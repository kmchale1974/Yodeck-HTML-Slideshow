name: Build all images.json

on:
  workflow_dispatch: {}
  push:
    paths:
      - "_Yodeck-HTML-Slideshow_Admin/images/**"
      - "_Yodeck-HTML-Slideshow_RAEC/images/**"
      - "_Yodeck-HTML-Slideshow_Rec/images/**"
      - "tools/gen_images_json.py"
      - ".github/workflows/build-all-images-json.yml"
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
    strategy:
      matrix:
        section:
          - _Yodeck-HTML-Slideshow_Admin
          - _Yodeck-HTML-Slideshow_RAEC
          - _Yodeck-HTML-Slideshow_Rec
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate images.json for ${{ matrix.section }}
        run: |
          python tools/gen_images_json.py <<'PY'
          from tools.gen_images_json import build_manifest
          import sys
          section = "${{ matrix.section }}"
          images_dir = f"{section}/images"
          out_path = f"{section}/images.json"
          changed = build_manifest(images_dir, out_path)
          # write a marker file unique to the section
          with open(f".changed-{section.replace('/','_')}", "w") as f:
            f.write("1" if changed else "0")
          PY

      - name: Commit changes (if any) for ${{ matrix.section }}
        run: |
          CHANGED=$(cat ".changed-${{ matrix.section }}" || echo 0)
          if [ "$CHANGED" = "1" ]; then
            git config user.name "gh-actions"
            git config user.email "actions@users.noreply.github.com"
            git add "${{ matrix.section }}/images.json"
            git commit -m "chore(${{
              matrix.section
            }}): update images.json [skip ci]" || echo "Nothing to commit"
            git push
          else
            echo "No manifest changes for ${{ matrix.section }}"
          fi
