mkdir -Force .github\workflows
@'
name: Build all images.json

on:
  workflow_dispatch: {}
  push:
    paths:
      - "_Yodeck-HTML-Slideshow_Admin/images/**"
      - "_Yodeck-HTML-Slideshow_RAEC/images/**"
      - "_Yodeck-HTML-Slideshow_Rec/images/**"
      - "tools/gen_images_json.py"
      - ".github/workflows/build-all-images-json.yml"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
    strategy:
      matrix:
        section:
          - _Yodeck-HTML-Slideshow_Admin
          - _Yodeck-HTML-Slideshow_RAEC
          - _Yodeck-HTML-Slideshow_Rec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate images.json for ${{ matrix.section }}
        run: |
          python - <<'PY'
          from tools.gen_images_json import build_manifest
          import sys
          section = "${{ matrix.section }}"
          changed = build_manifest(f"{section}/images", f"{section}/images.json")
          open(f".changed-{section.replace('/','_')}", "w").write("1" if changed else "0")
          PY
      - name: Commit changes (if any) for ${{ matrix.section }}
        run: |
          CHANGED=$(cat ".changed-${{ matrix.section }}" || echo 0)
          if [ "$CHANGED" = "1" ]; then
            git config user.name "gh-actions"
            git config user.email "actions@users.noreply.github.com"
            git add "${{ matrix.section }}/images.json"
            git commit -m "chore(${{
              matrix.section
            }}): update images.json [skip ci]" || echo "Nothing to commit"
            git push
          else
            echo "No manifest changes for ${{ matrix.section }}"
'@ | Set-Content -Encoding UTF8 .github\workflows\build-all-images-json.yml
