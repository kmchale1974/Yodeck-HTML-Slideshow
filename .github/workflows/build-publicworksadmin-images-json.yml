name: Build PublicWorksAdmin images.json (Runtime Pi-safe)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "_Yodeck-HTML-Slideshow_PublicWorksAdmin/images/**"
      - "tools/build_runtime_media_publicworksadmin.sh"
      - "tools/gen_images_json.py"
      - ".github/workflows/build-publicworksadmin-images-json.yml"

permissions:
  contents: write

jobs:
  build-publicworksadmin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build Runtime media (PublicWorksAdmin)
        run: |
          chmod +x tools/build_runtime_media_publicworksadmin.sh
          bash tools/build_runtime_media_publicworksadmin.sh

      - name: Generate images-publicworksadmin.json from Runtime images
        run: |
          python - <<'PY'
          from tools.gen_images_json import build_manifest
          build_manifest("_Yodeck-HTML-Slideshow_PublicWorksAdmin_Runtime/images", "images-publicworksadmin.json")
          PY

      - name: Commit changes if any
        run: |
          git config user.name "gh-actions"
          git config user.email "actions@users.noreply.github.com"

          git add images-publicworksadmin.json _Yodeck-HTML-Slideshow_PublicWorksAdmin_Runtime/images

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(publicworksadmin): rebuild Pi-safe media + manifest [skip ci]"
          git push
