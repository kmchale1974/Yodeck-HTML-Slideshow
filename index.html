<!-- index.html (drop-in, cleaned) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slideshow</title>

  <link rel="preload" href="style.css" as="style">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="slideshow" aria-live="off">
    <div class="slide" id="slideA" aria-hidden="true">
      <img id="imgA" class="media media-hidden" alt="" />
      <video id="vidA" class="media media-hidden" muted playsinline preload="metadata"></video>
      <div class="caption hidden" id="capA"></div>
    </div>

    <div class="slide" id="slideB" aria-hidden="true">
      <img id="imgB" class="media media-hidden" alt="" />
      <video id="vidB" class="media media-hidden" muted playsinline preload="metadata"></video>
      <div class="caption hidden" id="capB"></div>
    </div>

    <!-- Fallback banner (shown when manifest has no active items) -->
    <div id="fallback" class="fallback hidden" aria-live="polite">
      <div class="fallback-inner">
        <div class="fallback-title">No Slides Scheduled</div>
        <div class="fallback-sub">Content will appear automatically when available</div>
      </div>
    </div>

    <!-- Status (hidden unless error) -->
    <div id="status" class="status"></div>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);

    window.SS_CONFIG = {
      imagesManifest: qs.get('manifest') || 'images.json',
      defaultDuration: parseInt(qs.get('dur') || '10', 10), // seconds (images only)
      transitionMs: parseInt(qs.get('fade') || '500', 10),  // fade duration
      transitionMode: qs.get('mode') || 'smart',             // smart | fade | cut
      refreshMinutes: parseInt(qs.get('refresh') || '10', 10),
      showCaptions: (qs.get('captions') || '1') !== '0',
      objectFit: qs.get('fit') || 'contain',               // contain | cover
      bg: qs.get('bg') || '#000000',
      captionBg: qs.get('capbg') || 'rgba(0,0,0,0.4)',
      captionColor: qs.get('capcolor') || '#ffffff'
    };
  </script>

  <!-- Tip: if you want cache-busting, change the v= value when you deploy -->
  <script src="script.js?v=20260311a"></script>
</body>
</html>
